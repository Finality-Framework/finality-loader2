plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'team.rainfall.finality'
version = '1.6.0'


repositories {
    maven {
        url 'https://maven.aliyun.com/repository/public/'
    }
    maven {
        url "https://jitpack.io/"
    }
    maven {
        url "https://plugins.gradle.org/m2/"
    }
    mavenCentral()
}

dependencies {
    implementation project(':lumipatch-desktop')
    implementation group: 'org.semver4j', name: 'semver4j', version: '5.6.0'
    implementation group:'org.ow2.asm',name:'asm',version:'9.7'
    implementation group:'org.ow2.asm',name:'asm-commons',version:'9.7'
    implementation group:'org.ow2.asm',name:'asm-util',version:'9.7'
    implementation group:'org.ow2.asm',name:'asm-tree',version:'9.7'
    implementation group:'org.ow2.asm',name:'asm-analysis',version:'9.7'
    implementation 'commons-cli:commons-cli:1.9.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}

shadowJar {
    archiveClassifier = ''
    manifest {
        attributes 'Main-Class': 'team.rainfall.finality.loader.Main'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

java{
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

task beta {
    description = 'Create a beta set of Jars.'
    group = 'build'
    dependsOn clean, shadowJar, sourcesJar
}

task release {
    description = 'Create a release set of Jars.'
    group = 'build'
    dependsOn clean, shadowJar, sourcesJar
}
